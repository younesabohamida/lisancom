name: lisancom
description: Offline-first Arabic <-> German voice translator.
version: 0.2.0+2
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  google_mlkit_translation: ^1.0.3   # on-device translation (offline after model download)
  sherpa_onnx: ^2.0.1                # on-device Whisper speech recognition
  record: ^7.0.0                     # PCM16 microphone stream (AEC/NS/AGC)
  speech_to_text: ^7.0.0             # optional native STT (on-device when supported)
  flutter_tts: ^4.2.0                # system TTS (offline when voices are installed)
  http: ^1.2.2
  crypto: ^3.0.6
  path_provider: ^2.1.5
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/catalog.json
    - assets/phrasebooks/phrases.json
